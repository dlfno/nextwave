services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nextwave
      POSTGRES_USER: nextwave
      POSTGRES_PASSWORD: nextwave_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextwave -d nextwave"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - nextwave_demo_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: back/Dockerfile
    environment:
      DATABASE_URL: postgresql://nextwave:nextwave_demo@postgres:5432/nextwave
      FRONTEND_ORIGIN: http://localhost:4000
      COOKIE_SECURE: "false"
      NODE_ENV: production
      PORT: 3000
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-nextwave-demo-2026}
      DEMO_BOOTSTRAP_ACCOUNTS: "true"
      DEMO_RESET_IF_EMPTY: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CLARIFICATION_MODEL: ${OPENAI_CLARIFICATION_MODEL:-gpt-5.6-luna}
      OPENAI_RESEARCH_MODEL: ${OPENAI_RESEARCH_MODEL:-gpt-5.6-terra}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-20000}
      NUBEVIA_UCP_BASE_URL: http://nubevia:3100
      PAYMENT_CREDENTIAL_PROVIDER: ${PAYMENT_CREDENTIAL_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_SPT_TEST_PAYMENT_METHOD: ${STRIPE_SPT_TEST_PAYMENT_METHOD:-pm_card_visa}
      STRIPE_TIMEOUT_MS: ${STRIPE_TIMEOUT_MS:-10000}
      WEB_DISCOVERY_SOURCES_JSON: ${WEB_DISCOVERY_SOURCES_JSON:-[]}
      WEB_DISCOVERY_TIMEOUT_MS: ${WEB_DISCOVERY_TIMEOUT_MS:-4000}
      WEB_DISCOVERY_MAX_BYTES: ${WEB_DISCOVERY_MAX_BYTES:-512000}
    depends_on:
      postgres:
        condition: service_healthy
      nubevia:
        condition: service_healthy
    volumes:
      - nextwave_demo_secrets:/app/runtime-secrets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  nubevia:
    build:
      context: .
      dockerfile: back/Dockerfile
    command: ["./nubevia-entrypoint.sh"]
    environment:
      NODE_ENV: production
      PORT: 3100
      UCP_PLATFORM_PROFILE_URL: http://api:3000/.well-known/ucp
    volumes:
      - nextwave_nubevia_secrets:/app/nubevia-secrets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: front/Dockerfile
    environment:
      API_BASE_URL: http://api:3000
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  nextwave_demo_data:
  nextwave_demo_secrets:
  nextwave_nubevia_secrets:
